<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><title>Taqdimot Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PptxGenJS/3.12.0/pptxgen.bundle.js"></script>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--tx2:#6c6c70;--line:#d1d1d6;--blue:#007aff;--bar:rgba(249,249,249,.85);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--line:#38383a;--blue:#0a84ff;--bar:rgba(30,30,30,.85)}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--line:#38383a;--blue:#0a84ff;--bar:rgba(30,30,30,.85)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px 96px}
h1{font-size:34px;font-weight:700;letter-spacing:.2px;margin:18px 0 4px}
.sub{color:var(--tx2);font-size:15px;margin:0 0 18px}
.sec{font-size:13px;text-transform:uppercase;color:var(--tx2);margin:22px 16px 6px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:46px;border-bottom:.5px solid var(--line);font-size:17px}
.row:last-child{border-bottom:0}
.row input[type=text],.row textarea{border:0;outline:0;background:transparent;color:var(--tx);font:inherit;width:100%;text-align:right}
.row textarea{text-align:left;resize:none;min-height:70px}
.row.col{flex-direction:column;align-items:stretch}
.seg{display:flex;background:rgba(118,118,128,.18);border-radius:9px;padding:2px;width:100%}
.seg button{flex:1;border:0;background:transparent;color:var(--tx);font:inherit;font-size:14px;padding:7px 4px;border-radius:7px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);font-weight:600}
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;outline:2px solid transparent}
.sw button.on{outline-color:var(--blue)}
.tg{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.32);position:relative;border:0;flex:none;transition:.2s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:.2s}
.tg.on{background:#34c759}.tg.on::after{left:22px}
.step{display:flex;align-items:center;gap:14px}
.step button{width:32px;height:32px;border-radius:8px;border:0;background:rgba(118,118,128,.18);color:var(--blue);font-size:20px}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;font:inherit;font-weight:600;padding:15px;margin-top:22px;font-size:17px}
.btn.alt{background:rgba(0,122,255,.14);color:var(--blue);margin-top:10px}
.btn[disabled]{opacity:.5}
.tabs{position:fixed;left:0;right:0;bottom:0;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line);display:flex;justify-content:center;z-index:20}
.tabs div{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:none;color:var(--tx2);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button.on{color:var(--blue)}.tabs svg{width:26px;height:26px}
.deck{display:flex;gap:14px;padding:12px 16px;border-bottom:.5px solid var(--line);align-items:center}
.deck:last-child{border-bottom:0}
.thumb{width:72px;height:44px;border-radius:6px;flex:none}
.deck b{display:block;font-size:16px}.deck small{color:var(--tx2)}
.deck .acts{margin-left:auto;display:flex;gap:6px}
.deck .acts button{border:0;background:none;color:var(--blue);font-size:15px;padding:6px}
.slide{aspect-ratio:16/9;border-radius:14px;padding:6% 7%;display:flex;flex-direction:column;justify-content:center;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.slide h2{margin:0 0 3%;font-size:clamp(17px,5.4vw,30px);line-height:1.15}
.slide ul{margin:0;padding-left:1.1em;font-size:clamp(11px,3.2vw,17px);line-height:1.45}
.slide p{margin:0;font-size:clamp(11px,3.2vw,17px);line-height:1.45}
.slide.title{text-align:center;align-items:center}.slide.title h2{font-size:clamp(20px,6.5vw,38px)}
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0}
.nav button{border:0;background:var(--card);color:var(--blue);font-size:22px;width:44px;height:44px;border-radius:22px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
.hdr button{border:0;background:none;color:var(--blue);font:inherit;font-size:17px;padding:6px 0}
.pres{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center;padding:2vw}
.pres .slide{width:min(96vw,170vh);box-shadow:none}
.pres .slide h2{font-size:clamp(22px,5vw,64px)}.pres .slide ul,.pres .slide p{font-size:clamp(14px,2.6vw,34px)}
.pres .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;color:#fff;border:0;background:rgba(255,255,255,.2);border-radius:16px;padding:6px 14px;font:inherit}
.load{text-align:center;padding:60px 20px;color:var(--tx2)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(60,60,60,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:60}
.empty{text-align:center;color:var(--tx2);padding:50px 20px}
.notes{font-size:14px;color:var(--tx2);padding:12px 16px}
</style></head><body>
<div class="app" id="app"></div>
<div class="tabs"><div>
<button id="t0" onclick="go('new')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Yaratish</button>
<button id="t1" onclick="go('lib')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>Kutubxona</button>
<button id="t2" onclick="go('set')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>Sozlamalar</button>
</div></div>
<script>
/* 1) Worker manzilini shu yerga qo‘ying, masalan: https://taqdimot-ai.SIZNING.workers.dev */
const API_URL="";
async function ask(prompt){
 if(API_URL){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  if(!r.ok)throw new Error("API "+r.status);const j=await r.json();
  return JSON.parse(String(j.text||"").replace(/```json|```/g,"").trim())}
 const sample=await claude.use("sample");return sample.json(prompt,{modelTier:"default"})}
const THEMES=[["Ko‘k","#0a84ff","#eaf3ff","#0b2a52"],["Yashil","#30a46c","#e8f6ee","#0f3d27"],["Binafsha","#7c5cff","#f0ecff","#2a1d66"],["To‘q sariq","#ff9500","#fff2e0","#5c3500"],["Qizil","#ff375f","#ffebf0","#5e0f22"],["Qora","#1c1c1e","#f2f2f7","#111111"]];
const LANGS={uz:"o‘zbek tilida (lotin)",ru:"rus tilida",en:"ingliz tilida"};
const LEVELS=["Maktab","Litsey","Universitet","Ilmiy"];
let S={topic:"",author:"",lang:"uz",level:1,count:10,theme:0,notes:true,opt:{reja:true,xulosa:true,adabiyot:true,savol:true,rasm:false},extra:""};
let tab="new",lib=[],cur=null,idx=0,busy=false,pref={dark:"auto"};
try{lib=JSON.parse(localStorage.getItem("td_lib")||"[]");pref=Object.assign(pref,JSON.parse(localStorage.getItem("td_pref")||"{}"))}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function save(){try{localStorage.setItem("td_lib",JSON.stringify(lib));localStorage.setItem("td_pref",JSON.stringify(pref))}catch(e){}}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function applyPref(){const r=document.documentElement;if(pref.dark==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",pref.dark)}
function go(t){tab=t;if(t!=="view")cur=null;render()}
function render(){applyPref();["t0","t1","t2"].forEach((id,i)=>$("#"+id).classList.toggle("on",["new","lib","set"][i]===tab||(tab==="view"&&i===1)));
 const a=$("#app");
 if(tab==="new")a.innerHTML=busy?loading():newView();
 else if(tab==="lib")a.innerHTML=libView();
 else if(tab==="set")a.innerHTML=setView();
 else a.innerHTML=deckView();
 window.scrollTo(0,0)}
function loading(){return `<div class="load"><div class="spin"></div><b style="color:var(--tx)">Taqdimot tayyorlanmoqda…</b><p>Bir necha soniya kuting</p></div>`}
function tg(k,on){return `<button class="tg ${on?"on":""}" onclick="${k}" aria-label="almashtirish"></button>`}
function seg(items,sel,fn){return `<div class="seg">${items.map((t,i)=>`<button class="${i===sel?"on":""}" onclick="${fn}(${i})">${t}</button>`).join("")}</div>`}
function newView(){return `<h1>Yangi taqdimot</h1><p class="sub">Savollarga javob bering, qolganini o‘zim tayyorlayman.</p>
<div class="sec">1 · Mavzu</div><div class="group">
<div class="row col"><textarea id="topic" placeholder="Masalan: Piridin va pirimidin tuzilishi" oninput="S.topic=this.value">${esc(S.topic)}</textarea></div>
<div class="row"><span>Muallif</span><input type="text" id="author" placeholder="Ism familiya" value="${esc(S.author)}" oninput="S.author=this.value"></div></div>
<div class="sec">2 · Til va daraja</div><div class="group">
<div class="row col">${seg(["O‘zbekcha","Русский","English"],["uz","ru","en"].indexOf(S.lang),"setLang")}</div>
<div class="row col">${seg(LEVELS,S.level,"setLevel")}</div></div>
<div class="sec">3 · Slaydlar soni</div><div class="group"><div class="row"><span>Slaydlar</span><div class="step"><button onclick="cnt(-1)">−</button><b>${S.count}</b><button onclick="cnt(1)">+</button></div></div></div>
<div class="sec">4 · Rang uslubi</div><div class="group"><div class="row col"><div class="sw">${THEMES.map((t,i)=>`<button class="${i===S.theme?"on":""}" style="background:${t[1]}" title="${t[0]}" onclick="S.theme=${i};render()"></button>`).join("")}</div></div></div>
<div class="sec">5 · Nimalar bo‘lsin?</div><div class="group">
<div class="row"><span>Reja slaydi</span>${tg("opt('reja')",S.opt.reja)}</div>
<div class="row"><span>Xulosa</span>${tg("opt('xulosa')",S.opt.xulosa)}</div>
<div class="row"><span>Adabiyotlar ro‘yxati</span>${tg("opt('adabiyot')",S.opt.adabiyot)}</div>
<div class="row"><span>Savollar / E’tibor uchun rahmat</span>${tg("opt('savol')",S.opt.savol)}</div>
<div class="row"><span>Rasm joylari belgisi</span>${tg("opt('rasm')",S.opt.rasm)}</div>
<div class="row"><span>Spiker izohlari</span>${tg("S.notes=!S.notes;render()",S.notes)}</div></div>
<div class="sec">6 · Qo‘shimcha istak</div><div class="group"><div class="row col"><textarea placeholder="Masalan: ko‘proq misollar, formulalar, oddiy til…" oninput="S.extra=this.value">${esc(S.extra)}</textarea></div></div>
<button class="btn" onclick="gen()">Taqdimotni yaratish</button>`}
function setLang(i){S.lang=["uz","ru","en"][i];render()}function setLevel(i){S.level=i;render()}
function cnt(d){S.count=Math.max(4,Math.min(20,S.count+d));render()}
function opt(k){S.opt[k]=!S.opt[k];render()}
function setView(){return `<h1>Sozlamalar</h1><p class="sub">Ko‘rinish va ma’lumotlar.</p>
<div class="sec">Ko‘rinish</div><div class="group"><div class="row col">${seg(["Avto","Yorug‘","Qorong‘i"],["auto","light","dark"].indexOf(pref.dark),"setDark")}</div></div>
<div class="sec">Ma’lumotlar</div><div class="group"><div class="row"><span>Saqlangan taqdimotlar</span><b>${lib.length}</b></div>
<div class="row"><span style="color:#ff3b30" onclick="if(confirm('Hammasi o‘chirilsinmi?')){lib=[];save();render()}">Hammasini o‘chirish</span></div></div>
<p class="notes">Taqdimotlar faqat shu qurilmadagi brauzerda saqlanadi. Muhim ishni .pptx qilib yuklab oling.</p>`}
function setDark(i){pref.dark=["auto","light","dark"][i];save();render()}
function libView(){return `<h1>Kutubxona</h1><p class="sub">Yaratilgan taqdimotlaringiz.</p>`+(lib.length?`<div class="group">${lib.map((d,i)=>{const t=THEMES[d.theme];return `<div class="deck"><div class="thumb" style="background:${t[1]}"></div><div onclick="openDeck(${i})" style="min-width:0;flex:1"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.title)}</b><small>${d.slides.length} slayd · ${esc(d.author||"—")}</small></div><div class="acts"><button onclick="dup(${i})">Nusxa</button><button style="color:#ff3b30" onclick="del(${i})">O‘chir</button></div></div>`}).join("")}</div>`:`<div class="empty">Hali taqdimot yo‘q.<br>“Yaratish” bo‘limidan boshlang.</div>`)}
function openDeck(i){cur=i;idx=0;tab="view";render()}
function del(i){if(confirm("O‘chirilsinmi?")){lib.splice(i,1);save();render()}}
function dup(i){const c=JSON.parse(JSON.stringify(lib[i]));c.title+=" (nusxa)";lib.unshift(c);save();render();toast("Nusxa olindi")}
function slideHTML(s,t){const st=`background:${t[2]};color:${t[3]}`;if(s.type==="title")return `<div class="slide title" style="background:${t[1]};color:#fff"><h2>${esc(s.title)}</h2><p>${esc((s.bullets||[]).join(" · "))}</p></div>`;
 const body=s.bullets&&s.bullets.length?`<ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`:`<p>${esc(s.text||"")}</p>`;
 return `<div class="slide" style="${st}"><h2 style="color:${t[1]}">${esc(s.title)}</h2>${body}</div>`}
function deckView(){const d=lib[cur],t=THEMES[d.theme],s=d.slides[idx];
 return `<div class="hdr"><button onclick="go('lib')">‹ Kutubxona</button><button onclick="edit()">Tahrirlash</button></div>
<h1 style="font-size:26px">${esc(d.title)}</h1>${slideHTML(s,t)}
<div class="nav"><button onclick="mv(-1)">‹</button><b>${idx+1} / ${d.slides.length}</b><button onclick="mv(1)">›</button></div>
${s.notes?`<div class="sec">Spiker izohi</div><div class="group"><div class="notes" style="color:var(--tx)">${esc(s.notes)}</div></div>`:""}
<button class="btn" onclick="present()">Namoyish qilish</button>
<button class="btn alt" onclick="dl()">PowerPoint (.pptx) yuklab olish</button>
<button class="btn alt" onclick="regen()">Qayta yaratish</button>`}
function mv(d){const n=lib[cur].slides.length;idx=(idx+d+n)%n;render()}
function edit(){const s=lib[cur].slides[idx];const ti=prompt("Slayd sarlavhasi:",s.title);if(ti===null)return;s.title=ti||s.title;
 const cur0=(s.bullets&&s.bullets.length?s.bullets.join("\n"):s.text||"");const b=prompt("Matn (har qatorga bitta band uchun “|” ishlating):",cur0.replace(/\n/g," | "));
 if(b!==null){const p=b.split("|").map(x=>x.trim()).filter(Boolean);if(s.bullets&&s.bullets.length||p.length>1){s.bullets=p;delete s.text}else{s.text=p[0]||"";s.bullets=[]}}
 save();render()}
function present(){const d=lib[cur],t=THEMES[d.theme];const o=document.createElement("div");o.className="pres";let i=idx;
 const draw=()=>{o.innerHTML=`<button class="x">Yopish</button>`+slideHTML(d.slides[i],t);o.querySelector(".x").onclick=close};
 const key=e=>{if(e.key==="ArrowRight"||e.key===" ")nx(1);else if(e.key==="ArrowLeft")nx(-1);else if(e.key==="Escape")close()};
 const nx=k=>{i=Math.max(0,Math.min(d.slides.length-1,i+k));idx=i;draw()};
 function close(){document.removeEventListener("keydown",key);o.remove();render()}
 o.addEventListener("click",e=>{if(e.target.closest(".x"))return;nx(e.clientX>innerWidth/2?1:-1)});
 document.addEventListener("keydown",key);document.body.appendChild(o);draw()}
async function gen(){
 if(!S.topic.trim()){toast("Avval mavzuni yozing");return}
 busy=true;render();let deck=null;
 try{if(API_URL||window.claude){
  const need=[S.opt.reja&&"2-slayd: reja",S.opt.xulosa&&"xulosa slaydi",S.opt.adabiyot&&"adabiyotlar ro‘yxati slaydi",S.opt.savol&&"oxirgi slayd: savollar / e’tibor uchun rahmat",S.opt.rasm&&"mos slaydlarda rasm uchun [Rasm: ...] belgisi"].filter(Boolean).join("; ");
  const prompt=`Taqdimot tuz. Mavzu: "${S.topic}". Til: ${LANGS[S.lang]}. Daraja: ${LEVELS[S.level]}. Slaydlar soni: aynan ${S.count}. Muallif: ${S.author||"ko‘rsatilmagan"}. Majburiy slaydlar: birinchi slayd sarlavha slaydi; ${need||"yo‘q"}. ${S.extra?"Foydalanuvchi istagi: "+S.extra+".":""} Har bir slaydda 3–5 ta qisqa, aniq, faktik jihatdan to‘g‘ri band bo‘lsin (har biri 18 so‘zgacha). ${S.notes?"Har slaydga 1–2 gaplik spiker izohi yoz.":"notes bo‘sh bo‘lsin."} Faqat JSON qaytar: {"title":"...","slides":[{"type":"title"|"content","title":"...","bullets":["..."],"notes":"..."}]}. Sarlavha slaydida bullets ichiga muallif ismini qo‘y.`;
  deck=await ask(prompt)}}catch(e){console.warn(e)}
 if(!deck||!Array.isArray(deck.slides)||!deck.slides.length){deck=fallback();toast(API_URL||window.claude?"AI javob bermadi, oddiy shablon ishlatildi":"AI ulanmagan: oddiy shablon")}
 deck.slides=deck.slides.slice(0,20).map(s=>({type:s.type==="title"?"title":"content",title:String(s.title||""),bullets:Array.isArray(s.bullets)?s.bullets.map(String):[],text:s.text||"",notes:s.notes||""}));
 deck.title=deck.title||S.topic;deck.author=S.author;deck.theme=S.theme;deck.src=JSON.parse(JSON.stringify(S));
 lib.unshift(deck);save();busy=false;cur=0;idx=0;tab="view";render()}
function regen(){S=JSON.parse(JSON.stringify(lib[cur].src||S));tab="new";cur=null;render()}
function fallback(){const T=S.topic,sl=[{type:"title",title:T,bullets:S.author?[S.author]:[]}];
 if(S.opt.reja)sl.push({title:"Reja",bullets:["Kirish","Asosiy tushunchalar","Tuzilishi va xususiyatlari","Qo‘llanilishi","Xulosa"]});
 const mid=["Kirish","Asosiy tushunchalar","Tasnifi","Tuzilishi","Xossalari","Olinish usullari","Misollar","Qo‘llanilish sohalari","Istiqbollar"];
 const tail=(S.opt.xulosa?1:0)+(S.opt.adabiyot?1:0)+(S.opt.savol?1:0);
 while(sl.length<S.count-tail)sl.push({title:mid[(sl.length-1)%mid.length]+" — "+T,bullets:["Asosiy fikrni shu yerga yozing","Misol yoki dalil keltiring","Qisqa ta’rif bering"],notes:"Bu slaydni tahrirlab to‘ldiring."});
 if(S.opt.xulosa)sl.push({title:"Xulosa",bullets:["Asosiy natijalar","Amaliy ahamiyati"]});
 if(S.opt.adabiyot)sl.push({title:"Adabiyotlar",bullets:["Manba 1","Manba 2","Manba 3"]});
 if(S.opt.savol)sl.push({title:"E’tiboringiz uchun rahmat!",bullets:["Savollar?"]});
 return{title:T,slides:sl}}
async function dl(){const d=lib[cur],t=THEMES[d.theme],h=x=>x.slice(1);
 try{const p=new PptxGenJS();p.layout="LAYOUT_16x9";p.title=d.title;
  d.slides.forEach(s=>{const sl=p.addSlide();const ti=s.type==="title";sl.background={color:h(ti?t[1]:t[2])};
   if(ti){sl.addText(s.title,{x:.7,y:1.6,w:8.6,h:1.6,fontSize:36,bold:true,color:"FFFFFF",align:"center",valign:"middle",isTextBox:true});
    if(s.bullets.length)sl.addText(s.bullets.join(" · "),{x:.7,y:3.4,w:8.6,h:.6,fontSize:18,color:"FFFFFF",align:"center",isTextBox:true})}
   else{sl.addText(s.title,{x:.6,y:.4,w:8.8,h:.9,fontSize:28,bold:true,color:h(t[1]),valign:"middle",isTextBox:true});
    const body=s.bullets.length?s.bullets.map((b,i)=>({text:b,options:{bullet:true,breakLine:i<s.bullets.length-1,paraSpaceAfter:8}})):[{text:s.text||"",options:{}}];
